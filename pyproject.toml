[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "captionbench"
version = "0.1.0"
description = "Reproducible image captioning comparisons and human metric evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pillow>=11,<13",
  "nltk>=3.9,<4",
  "scipy>=1.15,<2",
]

[project.optional-dependencies]
models = ["torch>=2.6,<3", "transformers>=4.57,<6", "accelerate>=1,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
captionbench = "captionbench.cli:main"
captionbench-web = "captionbench.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/captionbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
